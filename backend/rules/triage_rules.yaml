meta:
  version: "1.0"
  updated: "2026-11-20"

# 1. Порядок срочности. Индекс = приоритет.
urgency_order:
  - "Самопомощь"
  - "Планово"
  - "Срочно (24ч)"
  - "Экстренно"

# 2. Красный флаг перекрывает любые другие правила
emergency_override:
  specialist: "Врач скорой помощи"
  urgency: "Экстренно"
  place: "Скорая"
  reason: "Выявлены признаки критического состояния — маршрутизация остановлена"

# 3. Базовая маршрутизация по категории жалобы
categories:
  боль:
    specialist: Терапевт
    place: Поликлиника
    urgency: "Планово"
    reason: "Боль требует уточнения локализации и очного осмотра"
  температура:
    specialist: Терапевт
    place: Поликлиника
    urgency: "Срочно (24ч)"
    reason: "Повышенная температура — нужен осмотр в течение суток"
  дыхание:
    specialist: Пульмонолог
    place: Поликлиника
    urgency: "Срочно (24ч)"
    reason: "Жалобы на дыхание требуют быстрой оценки специалиста"
  жкт:
    specialist: Гастроэнтеролог
    place: Поликлиника
    urgency: "Планово"
    reason: "Жалобы со стороны пищеварения — профиль гастроэнтеролога"
  кожа:
    specialist: Дерматолог
    place: Поликлиника
    urgency: "Планово"
    reason: "Изменения на коже — профиль дерматолога"
  неврология:
    specialist: Невролог
    place: Поликлиника
    urgency: "Планово"
    reason: "Неврологические жалобы — профиль невролога"
  травма:
    specialist: Хирург
    place: Приемный покой
    urgency: "Срочно (24ч)"
    reason: "Травма требует очного осмотра хирурга и, возможно, снимка"
  лор:
    specialist: ЛОР
    place: Поликлиника
    urgency: "Планово"
    reason: "Жалобы на ухо/горло/нос — профиль оториноларинголога"
  глаза:
    specialist: Офтальмолог
    place: Поликлиника
    urgency: "Срочно (24ч)"
    reason: "Зрение — орган с быстрым развитием осложнений, осмотр в течение суток"
  психиатрия:
    specialist: Психиатр
    place: Поликлиника
    urgency: "Планово"
    reason: "Эмоциональное состояние и сон — профиль психиатра"
  сердце:
    specialist: Кардиолог
    place: Поликлиника
    urgency: "Срочно (24ч)"
    reason: "Жалобы на сердцебиение и давление — профиль кардиолога"
  простуда:
    specialist: Терапевт
    place: Поликлиника
    urgency: "Самопомощь"
    reason: "Лёгкие простудные симптомы обычно проходят при домашнем уходе"
  другое:
    specialist: Терапевт
    place: Поликлиника
    urgency: "Планово"
    reason: "Терапевт определит профиль нужного специалиста"

# 4. Если категория не распознана
fallback:
  specialist: Терапевт
  place: Поликлиника
  urgency: "Планово"
  reason: "Категория жалобы не распознана — начните с терапевта"

# 5. Уточнение по локализации. Применяется к категории "боль".
localization_map:
  голова:    {specialist: Невролог,      reason: "Боль в голове — профиль невролога"}
  затылок:   {specialist: Невролог,      reason: "Боль в затылке — профиль невролога"}
  висок:     {specialist: Невролог,      reason: "Боль в виске — профиль невролога"}
  шея:       {specialist: Невролог,      reason: "Боль в шее — профиль невролога"}
  спина:     {specialist: Невролог,      reason: "Боль в спине — профиль невролога"}
  поясница:  {specialist: Невролог,      reason: "Боль в пояснице — профиль невролога"}
  грудь:     {specialist: Кардиолог,     urgency: "Срочно (24ч)", reason: "Боль в груди требует быстрой оценки кардиолога"}
  за грудиной: {specialist: Кардиолог,   urgency: "Срочно (24ч)", reason: "Боль за грудиной требует быстрой оценки кардиолога"}
  живот:     {specialist: Гастроэнтеролог, reason: "Боль в животе — профиль гастроэнтеролога"}
  подреберье: {specialist: Гастроэнтеролог, reason: "Боль в подреберье — профиль гастроэнтеролога"}
  горло:     {specialist: ЛОР,           reason: "Боль в горле — профиль ЛОР"}
  ухо:       {specialist: ЛОР,           reason: "Боль в ухе — профиль ЛОР"}
  уши:       {specialist: ЛОР,           reason: "Боль в ушах — профиль ЛОР"}
  нос:       {specialist: ЛОР,           reason: "Боль в области носа — профиль ЛОР"}
  пазух:     {specialist: ЛОР,           reason: "Боль в пазухах — профиль ЛОР"}
  зуб:       {specialist: Стоматолог,    reason: "Зубная боль — профиль стоматолога"}
  челюсть:   {specialist: Стоматолог,    reason: "Боль в челюсти — профиль стоматолога"}
  сустав:    {specialist: Хирург,        reason: "Боль в суставе — профиль хирурга"}
  колено:    {specialist: Хирург,        reason: "Боль в колене — профиль хирурга"}
  плечо:     {specialist: Хирург,        reason: "Боль в плече — профиль хирурга"}
  локоть:    {specialist: Хирург,        reason: "Боль в локте — профиль хирурга"}
  стопа:     {specialist: Хирург,        reason: "Боль в стопе — профиль хирурга"}
  глаз:      {specialist: Офтальмолог,   urgency: "Срочно (24ч)", reason: "Боль в глазу требует быстрого осмотра"}
  кожа:      {specialist: Дерматолог,    reason: "Боль в области кожи — профиль дерматолога"}

# 6. Хронические заболевания, повышают срочность
chronic_modifiers:
  диабет:
    match: ["диабет", "сахарный"]
    urgency_min: "Срочно (24ч)"
    reason: "Сахарный диабет повышает риск осложнений при любом остром состоянии"
  гипертония:
    match: ["гипертония", "гипертоническая", "высокое давление"]
    only_categories: ["сердце", "боль", "неврология"]
    urgency_min: "Срочно (24ч)"
    reason: "Артериальная гипертония в сочетании с этими жалобами требует контроля врача"
  астма:
    match: ["астма", "астматический"]
    only_categories: ["дыхание", "простуда"]
    specialist: Пульмонолог
    urgency_min: "Срочно (24ч)"
    reason: "Бронхиальная астма и жалобы на дыхание — нужен осмотр пульмонолога"
  онкология:
    match: ["онкология", "онкологический", "рак", "химиотерапия"]
    urgency_min: "Срочно (24ч)"
    reason: "Онкологический анамнез — необходим очный осмотр, удалённые каналы не применяются"
  ибс:
    match: ["ибс", "ишемическая", "стенокардия", "инфаркт в анамнезе"]
    only_categories: ["сердце", "боль", "дыхание"]
    specialist: Кардиолог
    urgency_min: "Срочно (24ч)"
    reason: "Ишемическая болезнь сердца — профиль кардиолога, осмотр в течение суток"
  сердечная недостаточность:
    match: ["сердечная недостаточность", "хсн"]
    only_categories: ["сердце", "дыхание", "боль"]
    specialist: Кардиолог
    urgency_min: "Срочно (24ч)"
    reason: "Сердечная недостаточность требует быстрой оценки кардиолога"
  эпилепсия:
    match: ["эпилепсия", "эпилептический"]
    only_categories: ["неврология"]
    specialist: Невролог
    urgency_min: "Срочно (24ч)"
    reason: "Эпилепсия в анамнезе — нужен осмотр невролога"
  иммунодефицит:
    match: ["иммунодефицит", "вич", "иммуносупресс", "после трансплантации"]
    urgency_min: "Срочно (24ч)"
    reason: "Сниженный иммунитет — инфекции протекают тяжелее, нужен очный осмотр"
  почки:
    match: ["хбп", "почечная недостаточность", "диализ"]
    urgency_min: "Срочно (24ч)"
    reason: "Хроническая болезнь почек влияет на тактику осмотра"

# 7. Анамнез и вредные привычки
anamnesis_modifiers:
  surgeries_last_year:
    only_categories: ["жкт", "боль", "травма", "температура"]
    urgency_min: "Срочно (24ч)"
    reason: "Операции или госпитализации за последний год — нужен очный осмотр"
  family_history:
    ссз:
      match: ["ссз", "инфаркт", "инсульт", "гипертония", "сердце"]
      only_categories: ["сердце", "боль"]
      specialist: Кардиолог
      reason: "Наследственность по сердечно-сосудистым заболеваниям учтена"
    онкология:
      match: ["онкология", "рак"]
      reason: "Онкологическая наследственность учтена — обсудите скрининг с терапевтом"
    диабет:
      match: ["диабет"]
      reason: "Наследственность по диабету учтена — обсудите контроль глюкозы с терапевтом"
  smoking:
    only_categories: ["дыхание", "сердце", "простуда"]
    reason: "Курение — фактор риска болезней дыхания и сердца, учтено при маршрутизации"
  allergies:
    reason: "Указаны аллергии — обязательно сообщите о них врачу на приёме"
  medications:
    reason: "Вы указали принимаемые лекарства — не отменяйте и не меняйте назначения самостоятельно"

# 8. Значения, которые считаем отсутствующими (фронт присылает текстом)
empty_markers: ["", "нет", "не знаю", "нет аллергии", "не принимаю", "отсутствуют", "-", "—", "ничего"]

# 9. Особые группы пациентов
modifiers:
  child:
    specialist: Педиатр
    urgency_min: "Срочно (24ч)"
    # Для этих категорий профильный специалист НЕ подменяется педиатром
    keep_specialist_for: ["травма", "глаза", "сердце"]
    block_remote: true
    reason: "Пациент — ребёнок: осмотр в течение суток, удалённые каналы не применяются"
  pregnant:
    urgency_min: "Срочно (24ч)"
    specialist_for:
      боль: Акушер-гинеколог
      жкт: Акушер-гинеколог
      температура: Акушер-гинеколог
    block_remote: true
    reason: "Беременность или лактация: очный осмотр в течение суток, самолечение исключено"

# 10. Признаки затяжного течения в свободном тексте — повышают срочность
severity_keywords:
  - urgency_min: "Срочно (24ч)"
    keywords:
      - "не сбивается"
      - "не помогает"
      - "третий день"
      - "больше трех дней"
      - "больше недели"
      - "не проходит неделю"
      - "становится хуже"
      - "стало хуже"
      - "усиливается"
      - "с каждым днем хуже"
    reason: "Симптомы сохраняются или усиливаются — нужен очный осмотр"

# 11. Политика места обращения
place_guards:
  # Эти места не подменяются ничем
  locked_places: ["Скорая", "Приемный покой"]
  # Удалённые каналы запрещены при этих условиях
  remote_blocked_urgency: ["Экстренно", "Срочно (24ч)"]
  remote_blocked_if_child: true
  remote_blocked_if_pregnant: true

place_rules:
  - id: telemed_skin
    place: Телемедицина
    categories: ["кожа"]
    allowed_urgency: ["Планово"]
    reason: "Кожные изменения часто оцениваются по фото — достаточно удалённой консультации"

  - id: telemed_psy
    place: Телемедицина
    categories: ["психиатрия"]
    allowed_urgency: ["Планово"]
    reason: "Тревога, стресс и нарушения сна обсуждаются со специалистом удалённо"

  - id: telemed_mild_gi
    place: Телемедицина
    categories: ["жкт"]
    allowed_urgency: ["Планово"]
    keywords: ["изжога", "вздутие", "отрыжка", "тяжесть после еды"]
    reason: "Лёгкие функциональные жалобы — можно начать с удалённой консультации"

  - id: telemed_followup
    place: Телемедицина
    categories: ["сердце", "неврология", "другое"]
    allowed_urgency: ["Планово"]
    keywords: ["повторный прием", "коррекция лечения", "продлить рецепт", "расшифровка анализов", "второе мнение"]
    reason: "Повторный вопрос по ранее назначенному лечению решается удалённо"

  - id: pharmacy_cold
    place: Аптека
    categories: ["простуда", "лор"]
    allowed_urgency: ["Самопомощь"]
    keywords: ["насморк", "заложен нос", "першит горло", "легкое покашливание", "небольшой кашель"]
    reason: "Лёгкие простудные симптомы — фармацевт подскажет безрецептурные средства ухода"

  - id: pharmacy_minor_skin
    place: Аптека
    categories: ["кожа"]
    allowed_urgency: ["Самопомощь"]
    keywords: ["сухость кожи", "шелушение", "легкое раздражение", "небольшая ссадина"]
    reason: "Незначительное раздражение кожи — достаточно консультации фармацевта"

  - id: pharmacy_minor_trauma
    place: Аптека
    categories: ["травма"]
    allowed_urgency: ["Самопомощь"]
    keywords: ["царапина", "ссадина", "заноза", "небольшой ушиб", "мелкая царапина"]
    reason: "Мелкое повреждение — фармацевт подскажет средства для обработки"

# 12. Тип оплаты
payment:
  ОМС:
    place: Поликлиника
    note: "Приём по полису ОМС в поликлинике по месту прикрепления, может потребоваться направление терапевта"
  ДМС:
    place: Частная клиника
    note: "Уточните в страховой компании, входит ли этот специалист в вашу программу ДМС"
  Платно:
    place: Частная клиника
    note: "Платный приём обычно доступен в день обращения без направления"

payment_allowed_urgency: ["Планово", "Самопомощь"]
payment_applies_to_places: ["Поликлиника"]

# 13. Самопомощь
self_care:
  allowed_urgency: ["Самопомощь"]
  tips:
    - "Пейте достаточно жидкости и больше отдыхайте"
    - "Проветривайте комнату и следите за влажностью воздуха"
    - "Измеряйте температуру 2–3 раза в день и записывайте результат"
    - "По безрецептурным средствам ухода проконсультируйтесь с фармацевтом"
  stop_signals:
    - "Температура держится больше 3 дней или поднимается выше 38.5"
    - "Появилась одышка, боль в груди, сыпь или спутанность сознания"
    - "Состояние заметно ухудшилось"
  stop_action: "Прекратите самолечение и обратитесь к врачу. При резком ухудшении — 103 или 112"
  forbidden:
    - "Названия препаратов и дозировки"
    - "Советы отменить или изменить назначенное лечение"
    - "Постановка диагноза"

# 14. Дисклеймеры — единый источник для фронта и бэка
disclaimers:
  start: "Я не ставлю диагноз и не заменяю врача. Моя задача — подсказать, к какому специалисту обратиться и насколько срочно."
  end: "При ухудшении состояния вызывайте скорую помощь по номеру 103 или 112."
  emergency: "Не ждите окончания опроса. Позвоните 103 или 112 прямо сейчас."
  no_prescriptions: "Я не назначаю лекарства и дозировки — это делает только врач."
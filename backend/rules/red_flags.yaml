red_flags:
  - id: "chest_pain"
    name: "Боль в груди"
    keywords:
      - "боль в груди"
      - "болит в груди"
      - "болит грудь"
      - "давит в груди"
      - "давит за грудиной"
      - "жжет в груди"
      - "жжёт в груди"
      - "сжимает грудь"
      - "сдавило грудь"
      - "болит сердце"
      - "отдает в руку"
      - "отдаёт в руку"
      - "отдает в левую"
      - "отдаёт в левую"
      - "отдает в челюсть"
      - "отдаёт в челюсть"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Боль в груди может быть признаком инфаркта. Не ждите окончания опроса."

  - id: "anaphylaxis"
    name: "Анафилаксия"
    keywords:
      - "отек горла"
      - "отёк горла"
      - "отек языка"
      - "отёк языка"
      - "отек губ"
      - "отёк губ"
      - "отек лица"
      - "отёк лица"
      - "опух язык"
      - "опухло горло"
      - "опухла шея"
      - "не могу глотать"
      - "трудно глотать"
      - "анафилак"
      - "крапивница по всему телу"
      - "сыпь и трудно дышать"
      - "после укуса стало трудно дышать"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Отёк дыхательных путей может быть признаком анафилаксии. Если есть автоинъектор адреналина — примените по инструкции."

  - id: "dyspnea_at_rest"
    name: "Одышка в покое"
    keywords:
      - "задыхаюсь"
      - "не могу дышать"
      - "не могу вдохнуть"
      - "не могу выдохнуть"
      - "не хватает воздуха"
      - "нехватка воздуха"
      - "одышка в покое"
      - "удушье"
      - "дышу через силу"
      - "свист при дыхании"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Одышка в покое — признак дыхательной недостаточности. Сядьте, обеспечьте доступ воздуха, не ложитесь."

  - id: "stroke_fast"
    name: "Признаки инсульта (FAST)"
    keywords:
      - "перекосило лицо"
      - "перекосил рот"
      - "асимметрия лица"
      - "опустился угол рта"
      - "не могу говорить"
      - "невнятная речь"
      - "нарушена речь"
      - "не поднимается рука"
      - "не могу поднять руку"
      - "онемела рука"
      - "онемела половина"
      - "отнялась нога"
      - "отнялась рука"
      - "слабость в руке и ноге"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Это могут быть признаки инсульта. счёт идёт на минуты — запомните время появления симптомов."

  - id: "head_trauma_loc"
    name: "Травма головы с потерей сознания"
    keywords:
      - "ударился головой и потерял"
      - "ударилась головой и потерял"
      - "после удара головой потерял"
      - "травма головы без сознания"
      - "упал на голову и отключился"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Травма головы с потерей сознания требует срочного осмотра. Не двигайте пострадавшего без необходимости."

  - id: "loss_of_consciousness"
    name: "Потеря сознания"
    keywords:
      - "потерял сознание"
      - "потеряла сознание"
      - "терял сознание"
      - "потере сознания"
      - "без сознания"
      - "не приходит в себя"
      - "отключился"
      - "вырубился"
      - "обморок"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Потеря сознания требует экстренной помощи. Уложите на бок, проверьте дыхание."

  - id: "seizure"
    name: "Судороги"
    keywords:
      - "судороги"
      - "судорог"
      - "припадок"
      - "конвульси"
      - "бьется в приступе"
      - "трясет и не реагирует"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Уберите опасные предметы, подложите мягкое под голову, ничего не вкладывайте в рот."

  - id: "severe_bleeding"
    name: "Кровотечение"
    keywords:
      - "кровь не останавливается"
      - "сильное кровотечение"
      - "обильное кровотечение"
      - "много крови"
      - "фонтан крови"
      - "кровь хлещет"
      - "рвота с кровью"
      - "кровь в стуле черным"
      - "черный стул"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Наложите давящую повязку на рану и не снимайте её."

  - id: "acute_abdomen"
    name: "Острая боль в животе"
    keywords:
      - "острый живот"
      - "кинжальная боль"
      - "резкая боль в животе"
      - "острая боль в животе"
      - "сильная боль в животе"
      - "нестерпимая боль в животе"
      - "невыносимая боль в животе"
      - "нестерпимо болит живот"
      - "живот твердый как доска"
      - "доскообразный живот"
      - "не могу разогнуться от боли"
      - "скрутило живот"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Острая боль в животе может требовать срочной операции. Не ешьте, не пейте, не принимайте обезболивающее и не прикладывайте тепло."

  - id: "severe_trauma"
    name: "Тяжёлая травма"
    keywords:
      - "оторвало"
      - "ампутация"
      - "открытый перелом"
      - "раздавлен"
      - "выпал из окна"
      - "выпала из окна"
      - "нож в ране"
      - "проникающее ранение"
    instruction: "Вызовите скорую помощь (103/112) немедленно! При тяжёлых травмах счёт идёт на минуты. Не двигайте пострадавшего и не извлекайте предметы из раны."

  # Требует доработки safety.py — см. п.5 (числовой порог + флаг is_child)
  - id: "child_fever"
    name: "Высокая температура у ребёнка"
    temp_threshold: 39.5
    requires_child: true
    keywords:
      - "у ребенка температура 39"
      - "у ребёнка температура 39"
      - "у ребенка температура 40"
      - "у ребёнка температура 40"
      - "у ребенка 39"
      - "у ребёнка 39"
      - "у ребенка 40"
      - "у ребёнка 40"
      - "ребенку 39"
      - "ребёнку 39"
      - "ребенку 40"
      - "ребёнку 40"
      - "температура 40"
      - "температура 41"
    instruction: "Вызовите скорую помощь (103/112) немедленно! Температура выше 39.5 у ребёнка опасна. Разденьте ребёнка, поите водой, не укутывайте."

  - id: "adult_hyperpyrexia"
    name: "Крайне высокая температура"
    temp_threshold: 41.0
    keywords: []
    instruction: "Вызовите скорую помощь (103/112) немедленно! Температура 41 и выше опасна для жизни. Разденьтесь, оботрите прохладной водой, не укутывайтесь."